<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Vishnu Sangadala — backend, GPU, and automation engineer</title>
  <desc id="desc">Animated terminal-inspired introduction highlighting Java, C++, CUDA, distributed systems, and UI automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d1b2d"/>
      <stop offset="1" stop-color="#10162a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="panelClip"><rect x="36" y="36" width="1128" height="358" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8b9db3; }
      .line { stroke: #26384f; stroke-width: 1; }
      .chip { fill: #111f33; stroke: #2b405c; }
      .cursor { animation: blink 1s steps(2, end) infinite; }
      .dash { stroke-dasharray: 8 12; animation: travel 10s linear infinite; }
      .pulse1 { animation: pulse 3.2s ease-in-out infinite; }
      .pulse2 { animation: pulse 3.2s ease-in-out .9s infinite; }
      .pulse3 { animation: pulse 3.2s ease-in-out 1.8s infinite; }
      .role1 { animation: roles 9s ease-in-out infinite; }
      .role2 { animation: roles 9s ease-in-out 3s infinite; opacity: 0; }
      .role3 { animation: roles 9s ease-in-out 6s infinite; opacity: 0; }
      @keyframes blink { 0%, 45% { opacity: 1 } 46%, 100% { opacity: 0 } }
      @keyframes travel { to { stroke-dashoffset: -200 } }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: 1; transform: scale(1.18) } }
      @keyframes roles { 0%, 28% { opacity: 1; transform: translateY(0) } 33%, 95% { opacity: 0; transform: translateY(-6px) } 100% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="45" r="260" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="95" cy="390" r="210" fill="#a371f7" opacity=".06" filter="url(#softGlow)"/>

  <g clip-path="url(#panelClip)" opacity=".32">
    <path d="M0 90H1200M0 170H1200M0 250H1200M0 330H1200" class="line"/>
    <path d="M120 0V430M280 0V430M440 0V430M600 0V430M760 0V430M920 0V430M1080 0V430" class="line"/>
  </g>

  <rect x="36" y="36" width="1128" height="358" rx="22" fill="#091423" fill-opacity=".78" stroke="#2a3e57"/>
  <path d="M36 86H1164" stroke="#2a3e57"/>
  <circle cx="69" cy="61" r="7" fill="#ff5f56"/>
  <circle cx="93" cy="61" r="7" fill="#ffbd2e"/>
  <circle cx="117" cy="61" r="7" fill="#27c93f"/>
  <text x="600" y="67" text-anchor="middle" class="mono muted" font-size="14">vishnu@engineering — profile</text>

  <g transform="translate(78 126)">
    <text class="mono" font-size="17" fill="#39d353">➜  ~  whoami</text>
    <text y="68" class="sans" font-size="48" font-weight="750" fill="#f0f6fc" letter-spacing="-.8">Vishnu Sangadala</text>
    <rect y="91" width="590" height="4" rx="2" fill="url(#accent)"/>
    <text y="132" class="mono role1" font-size="21" fill="#79c0ff">Java backend engineer</text>
    <text y="132" class="mono role2" font-size="21" fill="#d2a8ff">C++ / CUDA systems builder</text>
    <text y="132" class="mono role3" font-size="21" fill="#56d364">AI-powered UI automation engineer</text>
    <rect x="410" y="113" width="11" height="24" rx="1" fill="#58a6ff" class="cursor"/>

    <g transform="translate(0 165)">
      <rect width="128" height="36" rx="18" class="chip"/>
      <circle cx="19" cy="18" r="5" fill="#f89820" class="pulse1" transform-origin="19px 18px"/>
      <text x="34" y="23" class="mono" font-size="13" fill="#dce7f5">JAVA 21</text>

      <rect x="140" width="126" height="36" rx="18" class="chip"/>
      <circle cx="159" cy="18" r="5" fill="#659ad2" class="pulse2" transform-origin="159px 18px"/>
      <text x="174" y="23" class="mono" font-size="13" fill="#dce7f5">C++17</text>

      <rect x="278" width="116" height="36" rx="18" class="chip"/>
      <circle cx="297" cy="18" r="5" fill="#76b900" class="pulse3" transform-origin="297px 18px"/>
      <text x="312" y="23" class="mono" font-size="13" fill="#dce7f5">CUDA</text>

      <rect x="406" width="178" height="36" rx="18" class="chip"/>
      <circle cx="425" cy="18" r="5" fill="#58a6ff" class="pulse1" transform-origin="425px 18px"/>
      <text x="440" y="23" class="mono" font-size="13" fill="#dce7f5">DISTRIBUTED</text>
    </g>
  </g>

  <g transform="translate(790 128)">
    <path d="M16 30C85 30 58 104 128 104S171 178 240 178" fill="none" stroke="#2f81f7" stroke-width="2" class="dash"/>
    <path d="M16 178C85 178 58 104 128 104S171 30 240 30" fill="none" stroke="#a371f7" stroke-width="2" class="dash"/>

    <g transform="translate(0 10)">
      <rect width="104" height="42" rx="10" fill="#12233a" stroke="#2f81f7"/>
      <text x="52" y="26" text-anchor="middle" class="mono" font-size="13" fill="#79c0ff">BACKEND</text>
    </g>
    <g transform="translate(76 83)">
      <rect width="104" height="42" rx="10" fill="#192139" stroke="#a371f7"/>
      <text x="52" y="26" text-anchor="middle" class="mono" font-size="13" fill="#d2a8ff">SYSTEMS</text>
    </g>
    <g transform="translate(204 157)">
      <rect width="104" height="42" rx="10" fill="#102b25" stroke="#39d353"/>
      <text x="52" y="26" text-anchor="middle" class="mono" font-size="13" fill="#56d364">AUTOMATE</text>
    </g>

    <circle cx="16" cy="40" r="6" fill="#58a6ff" class="pulse1" transform-origin="16px 40px"/>
    <circle cx="128" cy="104" r="6" fill="#a371f7" class="pulse2" transform-origin="128px 104px"/>
    <circle cx="240" cy="188" r="6" fill="#39d353" class="pulse3" transform-origin="240px 188px"/>
  </g>

  <text x="78" y="370" class="mono muted" font-size="14">2+ years building reliable software</text>
  <text x="1122" y="370" text-anchor="end" class="mono muted" font-size="14">MS · Stony Brook University</text>
</svg>
